# Local host-browser testing: loopback signaling and internal bridge media.
port: 7880
bind_addresses: [0.0.0.0]
rtc:
  node_ip: 127.0.0.1
  use_external_ip: false
  advertise_internal_ip: true
  enable_loopback_candidate: true
  tcp_port: 7881
  udp_port: 7882
room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 30
  max_participants: 25
redis:
  address: redis:6379
logging:
  level: warn
