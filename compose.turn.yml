# Optional authenticated relay. The existing VPN keeps its IP:443.
# Default legacy mode advertises TLS5349 + UDP3478. TURN_INGRESS_443=true
# generates loopback TLS5349 behind compose.ingress443.yml on a separate IP:443.
services:
  livekit:
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    volumes: !override
      - ./deploy/turn-private/livekit.yaml:/etc/livekit.yaml:ro
  turn:
    image: imonmeets-turn:4.18.0-r0
    build:
      context: .
      dockerfile: deploy/Dockerfile.turn
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    network_mode: host
    command: ["-c", "/run/imon-turn/turnserver.conf"]
    volumes:
      - ./deploy/turn-private:/run/imon-turn:ro
    read_only: true
    tmpfs:
      - "/tmp:size=16m,mode=1777"
      - "/var/lib/coturn:size=16m,mode=1777"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
