# Optional authenticated relay. Port 443 remains owned by the existing VPN.
# TLS on 5349 helps UDP-blocked networks; 443-only networks need a separate endpoint.
services:
  livekit:
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    volumes: !override
      - ./deploy/turn-private/livekit.yaml:/etc/livekit.yaml:ro
  turn:
    image: imonmeets-turn:4.18.0-r0
    build:
      context: .
      dockerfile: deploy/Dockerfile.turn
    user: "${TURN_UID:-1000}:${TURN_GID:-1000}"
    network_mode: host
    command: ["-c", "/run/imon-turn/turnserver.conf"]
    volumes:
      - ./deploy/turn-private:/run/imon-turn:ro
    read_only: true
    tmpfs:
      - "/tmp:size=16m,mode=1777"
      - "/var/lib/coturn:size=16m,mode=1777"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
