# Standalone closed-main candidate, not an application or edge-VPS overlay.
# Assign and verify the authenticated transport before any runtime use.
name: imonmeets-edge-main-candidate
services:
  edge-main-bridge:
    profiles: [edge-main-candidate]
    image: haproxy:3.0-alpine@sha256:f06f6cc1c25c7071e62d955d8e67a33d6935066ced8fac496cdd0ad9ffdd17f3
    user: "0:0"
    network_mode: host
    command:
      ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    volumes:
      - type: bind
        source: ${EDGE_MAIN_HAPROXY_CONFIG:?Provide the absolute reviewed root-owned configuration path}
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    restart: "no"
    stop_grace_period: 65s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
