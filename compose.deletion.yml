# Application-side journal mount. The receiver belongs on an independent host.
services:
  app:
    environment:
      DELETION_JOURNAL_DIR: /var/lib/imonmeets/deletion-journal
    volumes:
      - type: bind
        source: ${DELETION_JOURNAL_HOST_DIR:?Initialize private durable journal before startup}
        target: /var/lib/imonmeets/deletion-journal
        bind: { create_host_path: false }
