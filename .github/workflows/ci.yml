name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: imonmeets_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: imonmeets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imonmeets_test -d imonmeets_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Pin the disposable PostgreSQL restore target
        env:
          CI_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test -n "$CI_DATABASE_CONTAINER"
          docker inspect "$CI_DATABASE_CONTAINER" >/dev/null
          docker rename "$CI_DATABASE_CONTAINER" imonmeets-ci-tests
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://imonmeets_test:ci-only-test-password@127.0.0.1:5432/imonmeets_test
          TEST_RESTORE_PG_CONTAINER: imonmeets-ci-tests
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-pull-encrypted-backup.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-offsite-monitor.py
      - name: Recording backup encryption and lifecycle regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-recording-backup.py
      - name: Deletion receiver and release evidence gates
        run: >-
          node --test
          apps/deletion-witness/test.mjs
          apps/deletion-witness/client.integration.test.mjs
          scripts/test-launch-readiness.mjs
          scripts/test-legal-consent-readiness.mjs
          scripts/test-release-manifest.mjs
          scripts/test-ingress443-config.mjs
          scripts/test-runtime-inventory.mjs
          scripts/test-external-media-policy.mjs
          scripts/test-google-oauth-policy.mjs
          scripts/test-edge-vps-ingress.mjs
      - name: Deletion deployment manifests use existing private mounts
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-deletion-compose.py
      - name: Merged Compose cutover identity and private configuration preflight
        run: node --test scripts/test-compose-cutover.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-prepare-recording.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 apps/analysis-worker/test_worker.py
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser state and accessibility regression checks
        run: |
          IMON_BROWSER_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')" npm run test:ui
      - name: Build immutable candidate and verify its installed npm inventory
        run: |
          python3 scripts/build-release-image.py --output-dir "$RUNNER_TEMP/imonmeets-candidate-image"
          IMON_CANDIDATE_IMAGE="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/imonmeets-candidate-image/build-receipt.json"))["imageId"])')"
          mkdir "$RUNNER_TEMP/imonmeets-runtime-evidence"
          chmod 700 "$RUNNER_TEMP/imonmeets-runtime-evidence"
          sudo -n docker run --rm --network none --read-only \
            --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PWD/scripts/verify-runtime-inventory.mjs,dst=/verification.mjs,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/imonmeets-runtime-evidence,dst=/evidence" \
            --entrypoint node "$IMON_CANDIDATE_IMAGE" /verification.mjs \
            --expected-commit "$GITHUB_SHA" --output-dir /evidence/runtime-inventory
      - name: Preserve candidate build and inventory receipts
        uses: actions/upload-artifact@v4
        with:
          name: imonmeets-candidate-evidence
          path: |
            ${{ runner.temp }}/imonmeets-candidate-image/build-receipt.json
            ${{ runner.temp }}/imonmeets-runtime-evidence/
