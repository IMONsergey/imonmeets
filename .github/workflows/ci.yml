name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      candidate_artifact_id: ${{ steps.candidate-image-upload.outputs.artifact-id }}
      candidate_manifest_sha256: ${{ steps.candidate-image-export.outputs.manifest_sha256 }}
      candidate_archive_sha256: ${{ steps.candidate-image-export.outputs.archive_sha256 }}
      candidate_image_id: ${{ steps.candidate-image-export.outputs.image_id }}
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: imonmeets_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: imonmeets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imonmeets_test -d imonmeets_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Pin the disposable PostgreSQL restore target
        env:
          CI_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test -n "$CI_DATABASE_CONTAINER"
          docker inspect "$CI_DATABASE_CONTAINER" >/dev/null
          docker rename "$CI_DATABASE_CONTAINER" imonmeets-ci-tests
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://imonmeets_test:ci-only-test-password@127.0.0.1:5432/imonmeets_test
          TEST_RESTORE_PG_CONTAINER: imonmeets-ci-tests
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-pull-encrypted-backup.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-offsite-monitor.py
      - name: Recording backup encryption and lifecycle regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-recording-backup.py
      - name: Deletion receiver and release evidence gates
        run: >-
          node --test
          apps/deletion-witness/test.mjs
          apps/deletion-witness/client.integration.test.mjs
          scripts/test-launch-readiness.mjs
          scripts/test-legal-consent-readiness.mjs
          scripts/test-release-manifest.mjs
          scripts/test-ingress443-config.mjs
          scripts/test-runtime-inventory.mjs
          scripts/test-external-media-policy.mjs
          scripts/test-google-oauth-policy.mjs
          scripts/test-edge-vps-ingress.mjs
          scripts/test-edge-main-ingress.mjs
          scripts/test-edge-certificates.mjs
      - name: Dedicated edge transport policy and lifecycle
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-edge-transport.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-edge-transport-lifecycle.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify-edge-transport-netns.py --self-check
      - name: Deletion deployment manifests use existing private mounts
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-deletion-compose.py
      - name: Merged Compose cutover identity and private configuration preflight
        run: node --test scripts/test-compose-cutover.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-prepare-recording.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 apps/analysis-worker/test_worker.py
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser state and accessibility regression checks
        run: |
          IMON_BROWSER_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')" npm run test:ui
      - name: Candidate image transfer identity and refusal regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ci-candidate-image.py
      - name: Build immutable candidate and verify its installed npm inventory
        run: |
          python3 scripts/build-release-image.py --output-dir "$RUNNER_TEMP/imonmeets-candidate-image"
          IMON_CANDIDATE_IMAGE="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/imonmeets-candidate-image/build-receipt.json"))["imageId"])')"
          mkdir "$RUNNER_TEMP/imonmeets-runtime-evidence"
          chmod 700 "$RUNNER_TEMP/imonmeets-runtime-evidence"
          sudo -n docker run --rm --network none --read-only \
            --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PWD/scripts/verify-runtime-inventory.mjs,dst=/verification.mjs,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/imonmeets-runtime-evidence,dst=/evidence" \
            --entrypoint node "$IMON_CANDIDATE_IMAGE" /verification.mjs \
            --expected-commit "$GITHUB_SHA" --output-dir /evidence/runtime-inventory
      - name: Preserve candidate build and inventory receipts
        uses: actions/upload-artifact@v4
        with:
          name: imonmeets-candidate-evidence
          path: |
            ${{ runner.temp }}/imonmeets-candidate-image/build-receipt.json
            ${{ runner.temp }}/imonmeets-runtime-evidence/
      - name: Export the already verified immutable candidate image
        id: candidate-image-export
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/edge-transport-acme-20261103' && github.repository == 'IMONsergey/imonmeets'
        timeout-minutes: 10
        run: |
          python3 scripts/ci-candidate-image.py export \
            --source-commit "$GITHUB_SHA" \
            --build-receipt "$RUNNER_TEMP/imonmeets-candidate-image/build-receipt.json" \
            --inventory-directory "$RUNNER_TEMP/imonmeets-runtime-evidence/runtime-inventory" \
            --directory "$RUNNER_TEMP/imonmeets-image-transfer"
      - name: Preserve the bounded candidate image transfer
        id: candidate-image-upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/edge-transport-acme-20261103' && github.repository == 'IMONsergey/imonmeets'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imonmeets-image-transfer-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imonmeets-image-transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  publish-candidate-image:
    needs: verify
    if: needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/release/edge-transport-acme-20261103' && github.repository == 'IMONsergey/imonmeets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: imonmeets-candidate-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out the trusted verifier at the exact successful source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's immutable transfer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/imonmeets-image-transfer
      - name: Verify source, image, payload and evidence identities
        env:
          IMON_EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.candidate_manifest_sha256 }}
          IMON_EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.candidate_archive_sha256 }}
          IMON_EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.candidate_image_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci-candidate-image.py verify \
            --source-commit "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/imonmeets-image-transfer" \
            --expected-manifest-sha256 "$IMON_EXPECTED_MANIFEST_SHA256" \
            --expected-archive-sha256 "$IMON_EXPECTED_ARCHIVE_SHA256" \
            --expected-image-id "$IMON_EXPECTED_IMAGE_ID" \
            --notes-file "$RUNNER_TEMP/imonmeets-candidate-notes.md"
      - name: Publish a new candidate prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-candidate-image.py check-release-absent --source-commit "$GITHUB_SHA"
          IMON_TRANSFER_DIR="$RUNNER_TEMP/imonmeets-image-transfer"
          gh release create "candidate-$GITHUB_SHA" \
            "$IMON_TRANSFER_DIR/imonmeets-app-$GITHUB_SHA.tar.gz" \
            "$IMON_TRANSFER_DIR/transfer-manifest.json" \
            "$IMON_TRANSFER_DIR/SHA256SUMS" \
            "$IMON_TRANSFER_DIR/build-receipt.json" \
            "$IMON_TRANSFER_DIR/inventory-receipt.json" \
            "$IMON_TRANSFER_DIR/installed-npm-tree.json" \
            "$IMON_TRANSFER_DIR/installed-npm-inventory.json" \
            "$IMON_TRANSFER_DIR/dependency-lock-sbom.cdx.json" \
            "$IMON_TRANSFER_DIR/runtime-npm-sbom.cdx.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "IMON Meets candidate $GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/imonmeets-candidate-notes.md"
