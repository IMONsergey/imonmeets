name: imonmeets

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-imonmeets-app:0.1.0}
  build: .
  environment:
    NODE_ENV: ${APP_ENV:-development}
    RELEASE_COMMIT: ${RELEASE_COMMIT:-}
    RELEASE_IMAGE_DIGEST: ${RELEASE_IMAGE_DIGEST:-}
    DATABASE_URL: postgres://imonmeets_app:${APP_DATABASE_PASSWORD:?Generate .env first}@db:5432/imonmeets
    HOST: 0.0.0.0
    PORT: 3540
    APP_URL: ${APP_URL:?Set APP_URL}
    EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate .env first}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    SUPPORT_HOURS: ${SUPPORT_HOURS:-}
    PUBLIC_LEGAL_APPROVED: ${PUBLIC_LEGAL_APPROVED:-false}
    PUBLIC_LEGAL_MANIFEST_PATH: ${PUBLIC_LEGAL_MANIFEST_PATH:-}
    PUBLIC_LEGAL_MANIFEST_SHA256: ${PUBLIC_LEGAL_MANIFEST_SHA256:-}
    EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-capture}
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAILS_PER_DAY: ${EMAILS_PER_DAY:-500}
    EMAILS_PER_WORKSPACE_DAY: ${EMAILS_PER_WORKSPACE_DAY:-100}
    EMAILS_PER_30D_BUCKET: ${EMAILS_PER_30D_BUCKET:-15000}
    ORIGIN_PROXY_SECRET: ${ORIGIN_PROXY_SECRET:-}
    DEV_ALLOW_UNVERIFIED_EMAIL: ${DEV_ALLOW_UNVERIFIED_EMAIL:-false}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    LIVEKIT_URL: ${LIVEKIT_URL:-}
    LIVEKIT_SIGNALING_AUTH_ENABLED: ${LIVEKIT_SIGNALING_AUTH_ENABLED:-false}
    LIVEKIT_SIGNALING_AUTH_SECRET: ${LIVEKIT_SIGNALING_AUTH_SECRET:-}
    LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Generate .env first}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Generate .env first}
    RECORDING_ENABLED: ${RECORDING_ENABLED:-false}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    MAX_WORKSPACES_PER_USER: ${MAX_WORKSPACES_PER_USER:-10}
    MAX_ROOMS_PER_WORKSPACE: ${MAX_ROOMS_PER_WORKSPACE:-200}
    MAX_MEMBERS_PER_WORKSPACE: ${MAX_MEMBERS_PER_WORKSPACE:-100}
    MAX_PARTICIPANTS_PER_ROOM: ${MAX_PARTICIPANTS_PER_ROOM:-100}
    MAX_PENDING_INVITATIONS: ${MAX_PENDING_INVITATIONS:-100}
    INVITATIONS_PER_USER_HOUR: ${INVITATIONS_PER_USER_HOUR:-20}
    MAX_ACTIVE_RECORDINGS: ${MAX_ACTIVE_RECORDINGS:-2}
    MAX_ACTIVE_ROOMS: ${MAX_ACTIVE_ROOMS:-20}
    RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-14}
    CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    BILLING_MODE: ${BILLING_MODE:-pilot}
    YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
    YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
    BILLING_PRO_PRICE_KOPECKS: ${BILLING_PRO_PRICE_KOPECKS:-149000}
    YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
    YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-}
    COMMERCIAL_TERMS_APPROVED: ${COMMERCIAL_TERMS_APPROVED:-false}
    BILLING_FREE_ROOMS: ${BILLING_FREE_ROOMS:-20}
    BILLING_FREE_MEMBERS: ${BILLING_FREE_MEMBERS:-10}
    BILLING_FREE_PARTICIPANTS: ${BILLING_FREE_PARTICIPANTS:-25}
    TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
    AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
    ANALYSIS_WORKER_URL: ${ANALYSIS_WORKER_URL:-}
    ANALYSIS_WORKER_SECRET: ${ANALYSIS_WORKER_SECRET:-}
    ANALYSIS_MODEL_MANIFEST_SHA256: ${ANALYSIS_MODEL_MANIFEST_SHA256:-}
    DELETION_JOURNAL_DIR: ${DELETION_JOURNAL_DIR:-}
    DELETION_JOURNAL_KEY: ${DELETION_JOURNAL_KEY:-}
    DELETION_RESTORE_REQUIRED: ${DELETION_RESTORE_REQUIRED:-false}
    DELETION_WITNESS_URL: ${DELETION_WITNESS_URL:-}
    DELETION_WITNESS_TOKEN: ${DELETION_WITNESS_TOKEN:-}
    DELETION_WITNESS_PUBLIC_KEY: ${DELETION_WITNESS_PUBLIC_KEY:-}
  init: true
  logging: *logs
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]

services:
  db:
    logging: *logs
    pids_limit: 128
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: imonmeets
      POSTGRES_DB: imonmeets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Generate .env first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U imonmeets -d imonmeets"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *logs
    pids_limit: 64
    image: valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    command:
      [
        valkey-server,
        --save,
        "",
        --appendonly,
        "no",
        --maxmemory,
        96mb,
        --maxmemory-policy,
        noeviction,
      ]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    logging: *logs
    pids_limit: 256
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Generate .env first}: ${LIVEKIT_API_SECRET:?Generate .env first}"
    command: [--config, /etc/livekit.yaml]
    volumes:
      [
        "${LIVEKIT_CONFIG_PATH:-./deploy/livekit.local.yaml}:/etc/livekit.yaml:ro",
      ]
    ports:
      - 127.0.0.1:7880:7880
      - 127.0.0.1:7881:7881
      - 127.0.0.1:7882:7882/udp
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 2.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  mailpit:
    logging: *logs
    pids_limit: 64
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports: ["127.0.0.1:3541:8025"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_MAX_MESSAGES: 200

  migrate:
    <<: *app
    command: [node, apps/api/dist/migrate.js]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    mem_limit: 512m

  app:
    <<: *app
    stop_grace_period: 35s
    ports: ["127.0.0.1:3540:3540"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      livekit: { condition: service_started }
      mailpit: { condition: service_started }
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3540/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
